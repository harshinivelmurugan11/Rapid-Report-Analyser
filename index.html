<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rapid Report Analyzer</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">

  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans Tamil -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar Navigation -->
    <nav id="nav" aria-label="Main Navigation"></nav>

    <!-- Main Content Container -->
    <main>
      <!-- Top Bar: Demo Tag & Language Switcher -->
      <div class="top">
        <span class="demo" id="demoTag"></span>
        <div class="lang" role="group" aria-label="Language">
          <button data-l="en" class="on">English</button>
          <button data-l="ta">தமிழ்</button>
        </div>
      </div>

      <!-- Dynamic View Container -->
      <div id="view"></div>

      <!-- Medical Disclaimer -->
      <p class="disc" id="disc"></p>
    </main>
  </div>

  <!-- Modular Application Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
